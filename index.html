<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky & Nature Gallery ☁️🌿</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0b4a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        
        header {
            margin-bottom: 30px;
        }

        h1 {
            color: #82aaff;
            font-size: 2em;
            margin-bottom: 5px;
        }

        p {
            color: #c7d5e0;
            font-size: 1.1em;
        }

        /* Pinterest-style Grid Layout */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Individual Photo Card */
        .card {
            background-color: #15155e;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            border: 1px solid #23237a;
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        .card-info {
            padding: 15px;
        }

        .card-info h3 {
            margin: 0 0 10px 0;
            color: #ffffff;
            font-size: 1.1em;
        }

        /* Download Button */
        .download-btn {
            display: inline-block;
            background-color: #00e676;
            color: #000000;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 20px;
            font-weight: bold;
            transition: background 0.2s ease;
        }

        .download-btn:hover {
            background-color: #00b359;
        }
    </style>
</head>
<body>

    <header>
        <h1>Sky & Nature Gallery ☁️✨</h1>
        <p>Explore and download high-quality nature wallpapers!</p>
    </header>

    <div class="gallery">
        
        <div class="card">
            <img src="https://images.unsplash.com/photo-1534088568595-a066f410bcda?w=600" alt="Sunset Sky">
            <div class="card-info">
                <h3>Golden Sunset</h3>
                <a href="https://images.unsplash.com/photo-1534088568595-a066f410bcda?w=1200" download class="download-btn">📥 Download</a>
            </div>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600" alt="Ocean & Sky">
            <div class="card-info">
                <h3>Ocean Waves</h3>
                <a href="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1200" download class="download-btn">📥 Download</a>
            </div>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=600" alt="Mountains">
            <div class="card-info">
                <h3>Mountain Peak</h3>
                <a href="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=1200" download class="download-btn">📥 Download</a>
            </div>
        </div>

    </div>

</body>
</html>
